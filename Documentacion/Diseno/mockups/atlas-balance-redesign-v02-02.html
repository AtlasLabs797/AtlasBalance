    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).

    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    }

      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };

      var i = h.indexOf(':');

    }

    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;

{"pages":{"Atlas Balance Redesign.dc":"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"04bd5369-caed-44af-9472-19e55843ece4\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>/* Atlas Balance — Webfont declarations\n   Hind Madurai  → headings / display\n   National Park → body / UI\n   Atlas Mono (JetBrains Mono) → numerals, amounts, code */\n\n@font-face {\n  font-family: \"National Park\";\n  src: url(\"39203844-0ff3-4ab3-b570-55fd10909b32\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"National Park\";\n  src: url(\"2f52f74d-4f3b-4af3-a4ba-71d03fd88b20\") format(\"truetype\");\n  font-weight: 700 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"b38d5ef5-6d8d-4988-8f25-38cf234cf9db\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"7810aee9-2f43-4153-84e8-0fd9538e22f5\") format(\"truetype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"d526e595-e6b0-485d-9b40-89d8fc46d736\") format(\"truetype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"da1d2265-26e0-4238-b2c6-49f626d370b1\") format(\"truetype\");\n  font-weight: 700 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Atlas Mono\";\n  src: url(\"f4b07c48-191c-4828-8532-8a839fd59d0f\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Atlas Mono\";\n  src: url(\"5d49d9b5-bc24-4735-8712-9f5f5747eea8\") format(\"truetype\");\n  font-weight: 700 800;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n  <style>/* Atlas Balance — Color tokens\n   Light theme on :root, dark theme on [data-theme=\"dark\"].\n   Base values first, semantic aliases (--color-*) layered on top. */\n\n:root {\n  /* ---- Surfaces ---- */\n  --bg-app: #f3f7fb;\n  --bg-canvas: #f7fafc;\n  --bg-surface: #fbfcfe;\n  --bg-surface-soft: #f1f5fa;\n  --bg-surface-muted: #e9eff6;\n  --bg-input: #fbfcfe;\n  --bg-hover: #e9eff6;\n  --bg-selected: #e6eefc;\n\n  /* ---- Borders ---- */\n  --border-soft: rgba(23, 33, 52, 0.10);\n  --border-strong: rgba(23, 33, 52, 0.18);\n  --border-medium: var(--border-strong);\n  --border-focus: #285bd9;\n\n  /* ---- Text ---- */\n  --text-primary: #172033;\n  --text-secondary: #536174;\n  --text-muted: #5f6b7a;\n  --text-inverse: #f8fbff;\n  --text-link: #244fbd;\n\n  /* ---- Accent (treasury blue) ---- */\n  --accent-primary: #285bd9;\n  --accent-primary-hover: #214cad;\n  --accent-primary-soft: #e6eefc;\n\n  /* ---- Semantic status ---- */\n  --success-bg: #eaf8f0;\n  --success-text: #176a3a;\n  --warning-bg: #fff4df;\n  --warning-text: #8a5200;\n  --danger-bg: #fdecef;\n  --danger-text: #a82234;\n  --info-bg: #eaf1ff;\n  --info-text: #315fcf;\n\n  /* ---- Financial amounts ---- */\n  --amount-positive: #176a3a;\n  --amount-negative: #a82234;\n\n  /* ---- Charts ---- */\n  --chart-ingresos: #2f9f68;\n  --chart-egresos: #c94a5a;\n  --chart-saldo: #285bd9;\n  --chart-grid: rgba(23, 33, 52, 0.10);\n  --chart-series-1: #3f7dbe;\n  --chart-series-2: #2f9f68;\n  --chart-series-3: #c5663d;\n  --chart-series-4: #8d62a8;\n  --chart-series-5: #9a751d;\n  --chart-series-6: #4f93d4;\n  --chart-series-7: #4aa584;\n  --chart-series-8: #d07652;\n  --chart-series-9: #a978b8;\n  --chart-series-10: #b98924;\n  --chart-series-other: #536174;\n\n  /* ---- Flagged / review rows ---- */\n  --row-flagged-bg: #fff2bd;\n  --row-flagged-border: rgba(172, 118, 0, 0.42);\n\n  /* ---- Sidebar ---- */\n  --color-bg-sidebar: #fbfcfe;\n  --color-sidebar-text: #445266;\n  --color-sidebar-active-bg: var(--accent-primary-soft);\n  --color-sidebar-active-text: #214cad;\n\n  /* ====================================================\n     Semantic aliases — prefer these in components\n     ==================================================== */\n  --color-bg-primary: var(--bg-surface);\n  --color-bg-secondary: var(--bg-app);\n  --color-bg-tertiary: var(--bg-surface-muted);\n  --color-bg-input: var(--bg-input);\n  --color-bg-hover: var(--bg-hover);\n  --color-bg-selected: var(--bg-selected);\n  --color-bg-danger: var(--danger-bg);\n  --color-bg-warning: var(--warning-bg);\n  --color-bg-success: var(--success-bg);\n\n  --color-button-secondary-bg: var(--bg-surface-soft);\n  --color-button-secondary-hover: var(--bg-surface-muted);\n  --color-button-secondary-border: var(--border-strong);\n  --color-button-secondary-text: var(--text-primary);\n\n  --color-text-primary: var(--text-primary);\n  --color-text-secondary: var(--text-secondary);\n  --color-text-muted: var(--text-muted);\n  --color-text-inverse: var(--text-inverse);\n  --color-text-link: var(--text-link);\n  --color-text-danger: var(--danger-text);\n  --color-text-success: var(--success-text);\n  --color-amount-positive: var(--amount-positive);\n  --color-amount-negative: var(--amount-negative);\n\n  --color-border-primary: var(--border-soft);\n  --color-border-focus: var(--border-focus);\n  --color-border-danger: rgba(168, 34, 52, 0.34);\n\n  --color-accent: var(--accent-primary);\n  --color-accent-hover: var(--accent-primary-hover);\n  --color-danger: var(--danger-text);\n  --color-danger-hover: #8f1d2c;\n  --color-success: var(--success-text);\n  --color-warning: var(--warning-text);\n\n  --color-row-flagged: var(--row-flagged-bg);\n  --color-row-flagged-border: var(--row-flagged-border);\n\n  /* ---- Surface composition helpers ---- */\n  --surface-border: var(--border-soft);\n  --surface-border-hover: color-mix(in srgb, var(--accent-primary) 24%, var(--border-soft));\n  --surface-bg-raised: color-mix(in srgb, var(--bg-surface) 94%, transparent);\n  --surface-bg-sunken: color-mix(in srgb, var(--bg-surface-soft) 84%, var(--bg-app));\n  --surface-highlight: color-mix(in srgb, var(--accent-primary) 8%, var(--bg-surface));\n}\n\n[data-theme=\"dark\"] {\n  --bg-app: #12171f;\n  --bg-canvas: #151b24;\n  --bg-surface: #1b2330;\n  --bg-surface-soft: #202a38;\n  --bg-surface-muted: #293545;\n  --bg-input: #161d27;\n  --bg-hover: #242f3e;\n  --bg-selected: #233558;\n\n  --border-soft: rgba(216, 226, 240, 0.10);\n  --border-strong: rgba(216, 226, 240, 0.18);\n  --border-medium: var(--border-strong);\n  --border-focus: #82a4ff;\n\n  --text-primary: #f1f5f9;\n  --text-secondary: #b7c2d2;\n  --text-muted: #98a6ba;\n  --text-inverse: #101720;\n  --text-link: #a8bdff;\n\n  --accent-primary: #82a4ff;\n  --accent-primary-hover: #a8bdff;\n  --accent-primary-soft: rgba(130, 164, 255, 0.14);\n\n  --success-bg: rgba(81, 185, 124, 0.14);\n  --success-text: #8de0ae;\n  --warning-bg: rgba(209, 144, 44, 0.16);\n  --warning-text: #f3c270;\n  --danger-bg: rgba(216, 74, 91, 0.16);\n  --danger-text: #ff9aa7;\n  --info-bg: rgba(130, 164, 255, 0.14);\n  --info-text: #b9c9ff;\n\n  --amount-positive: #8de0ae;\n  --amount-negative: #ff9aa7;\n\n  --chart-ingresos: #78d99c;\n  --chart-egresos: #ff8795;\n  --chart-saldo: #9fb6ff;\n  --chart-grid: rgba(216, 226, 240, 0.10);\n  --chart-series-1: #82b8f4;\n  --chart-series-2: #78d99c;\n  --chart-series-3: #ff9f78;\n  --chart-series-4: #d7a3e5;\n  --chart-series-5: #f0c96e;\n  --chart-series-6: #65a7df;\n  --chart-series-7: #5fc28f;\n  --chart-series-8: #ea8c69;\n  --chart-series-9: #c58cda;\n  --chart-series-10: #ddb857;\n  --chart-series-other: #b7c2d2;\n\n  --row-flagged-bg: rgba(255, 196, 70, 0.18);\n  --row-flagged-border: rgba(255, 213, 112, 0.42);\n\n  --color-bg-sidebar: #1b2330;\n  --color-sidebar-text: #c0cbda;\n  --color-sidebar-active-bg: rgba(130, 164, 255, 0.16);\n  --color-sidebar-active-text: #d5ddff;\n\n  --surface-bg-raised: color-mix(in srgb, var(--bg-surface) 90%, transparent);\n  --surface-bg-sunken: color-mix(in srgb, var(--bg-surface-soft) 76%, var(--bg-app));\n  --surface-highlight: color-mix(in srgb, var(--accent-primary) 12%, var(--bg-surface));\n}\n<\u002Fstyle>\n  <style>/* Atlas Balance — Typography tokens\n   Headings: Hind Madurai · Body/UI: National Park · Numerals: Atlas Mono */\n\n:root {\n  --font-family-heading: \"Hind Madurai\", \"Aptos Display\", \"Segoe UI\", sans-serif;\n  --font-family: \"National Park\", \"Aptos\", \"Segoe UI\", sans-serif;\n  --font-family-mono: \"Atlas Mono\", \"JetBrains Mono\", \"SF Mono\", monospace;\n\n  /* Type scale (rem, base 16px) */\n  --font-size-xs: 0.75rem;    /* 12px — labels, meta, badges */\n  --font-size-sm: 0.8125rem;  /* 13px — secondary text, table cells */\n  --font-size-base: 0.875rem; /* 14px — body default */\n  --font-size-md: 1rem;       /* 16px — emphasis, topbar title */\n  --font-size-lg: 1.125rem;   /* 18px — card headings */\n  --font-size-xl: 1.5rem;     /* 24px — section titles (h2) */\n  --font-size-2xl: 2rem;      /* 32px — page titles (h1) */\n  --font-size-kpi: clamp(2rem, 3vw, 2.75rem); /* hero metrics */\n\n  /* Weights */\n  --font-weight-normal: 400;\n  --font-weight-medium: 500;\n  --font-weight-semibold: 600;\n  --font-weight-bold: 700;\n  --font-weight-heavy: 800;\n\n  /* Line heights */\n  --line-height-tight: 1.18;  /* headings */\n  --line-height-normal: 1.55; /* body */\n}\n<\u002Fstyle>\n  <style>/* Atlas Balance — Spacing, sizing & layout tokens\n   8px-based rhythm with named aliases. */\n\n:root {\n  /* Raw spacing steps */\n  --space-1: 0.25rem;  /* 4 */\n  --space-2: 0.5rem;   /* 8 */\n  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.5rem;   /* 24 */\n  --space-6: 2rem;     /* 32 */\n  --space-8: 3rem;     /* 48 */\n  --space-10: 4rem;    /* 64 */\n\n  /* Named aliases */\n  --space-xxs: var(--space-1);\n  --space-xs: var(--space-2);\n  --space-sm: var(--space-3);\n  --space-md: var(--space-4);\n  --space-lg: var(--space-5);\n  --space-xl: var(--space-6);\n  --space-2xl: var(--space-8);\n  --space-3xl: var(--space-10);\n\n  /* App shell dimensions */\n  --sidebar-width: 252px;\n  --sidebar-collapsed-width: 72px;\n  --topbar-height: 68px;\n\n  /* Control sizing */\n  --control-height: 2.75rem;          /* 44px — min hit target */\n  --control-height-compact: 2.45rem;\n  --control-padding-x: var(--space-3);\n}\n<\u002Fstyle>\n  <style>/* Atlas Balance — Radii, shadows, motion & z-index tokens.\n   Premium feel: soft layered shadows, a single signature easing curve,\n   restrained radii (8px controls/cards, larger panels & shell). */\n\n:root {\n  /* ---- Corner radii ---- */\n  --border-radius-sm: 8px;\n  --border-radius-md: 8px;\n  --border-radius-lg: 12px;\n  --border-radius-full: 999px;\n  --radius-control: 8px;   /* buttons, inputs, selects */\n  --radius-card: 8px;      /* cards, KPI tiles */\n  --radius-panel: 18px;    /* modals, auth card, sheets */\n  --radius-shell: 22px;    /* outermost shells */\n  --radius-pill: 999px;    /* badges, chips */\n\n  /* ---- Control surfaces ---- */\n  --control-border: var(--border-strong);\n  --control-bg: var(--bg-input);\n  --control-bg-hover: var(--bg-hover);\n  --control-ring: 0 0 0 3px color-mix(in srgb, var(--border-focus) 18%, transparent);\n\n  /* ---- Shadow system (warm, low-opacity, layered) ---- */\n  --shadow-sm: 0 2px 10px color-mix(in srgb, var(--text-primary) 5%, transparent);\n  --shadow-md: 0 10px 28px color-mix(in srgb, var(--text-primary) 7%, transparent);\n  --shadow-lg: 0 16px 38px color-mix(in srgb, var(--text-primary) 9%, transparent);\n  --shadow-overlay: 0 24px 60px color-mix(in srgb, var(--text-primary) 16%, transparent);\n  --shadow-card: 0 8px 24px color-mix(in srgb, var(--text-primary) 6%, transparent);\n  --shadow-card-hover: 0 16px 34px color-mix(in srgb, var(--text-primary) 10%, transparent);\n  --shadow-shell: 0 24px 60px color-mix(in srgb, var(--text-primary) 12%, transparent);\n  --shadow-focus: var(--control-ring);\n\n  /* ---- Motion ---- */\n  --ease-premium: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --duration-instant: 120ms; /* @kind other */\n  --duration-fast: 180ms; /* @kind other */\n  --duration-base: 240ms; /* @kind other */\n  --duration-slow: 420ms; /* @kind other */\n  --transition-fast: var(--duration-fast) var(--ease-premium);\n  --transition-normal: var(--duration-base) var(--ease-premium);\n\n  /* ---- Z-index scale ---- */\n  --z-dropdown: 100; /* @kind other */\n  --z-sticky: 200; /* @kind other */\n  --z-modal-backdrop: 300; /* @kind other */\n  --z-modal: 400; /* @kind other */\n  --z-toast: 500; /* @kind other */\n  --z-tooltip: 600; /* @kind other */\n}\n\n[data-theme=\"dark\"] {\n  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.22);\n  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.28);\n  --shadow-lg: 0 16px 38px rgba(0, 0, 0, 0.34);\n  --shadow-overlay: 0 24px 60px rgba(0, 0, 0, 0.48);\n  --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.26);\n  --shadow-card-hover: 0 16px 36px rgba(0, 0, 0, 0.36);\n  --shadow-shell: 0 24px 60px rgba(0, 0, 0, 0.44);\n}\n<\u002Fstyle>\n  <style>/* Atlas Balance — Base element styling.\n   Resets + foundational typography, controls, tables. Consumes tokens. */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml {\n  font-size: 16px;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  color-scheme: light;\n}\n\nhtml[data-theme=\"dark\"] {\n  color-scheme: dark;\n}\n\n:focus-visible {\n  outline: 2px solid var(--color-border-focus);\n  outline-offset: 2px;\n}\n\nbody {\n  font-family: var(--font-family);\n  font-size: var(--font-size-base);\n  line-height: var(--line-height-normal);\n  color: var(--color-text-primary);\n  background: var(--bg-app);\n  font-variant-numeric: tabular-nums;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-family-heading);\n  font-weight: var(--font-weight-semibold);\n  line-height: var(--line-height-tight);\n  color: var(--color-text-primary);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--font-size-2xl); }\nh2 { font-size: var(--font-size-xl); }\nh3 { font-size: var(--font-size-lg); }\nh4 { font-size: var(--font-size-md); }\nh5 { font-size: var(--font-size-base); }\nh6 { font-size: var(--font-size-sm); }\n\na {\n  color: var(--color-text-link);\n  text-decoration: none;\n  text-underline-offset: 0.18em;\n}\na:hover { text-decoration: underline; }\n\ninput, textarea, select, button {\n  font-family: inherit;\n  font-size: inherit;\n}\n\ninput, textarea, select {\n  background: var(--control-bg);\n  border: 1px solid var(--control-border);\n  border-radius: var(--radius-control);\n  padding: var(--space-2) var(--control-padding-x);\n  color: var(--color-text-primary);\n  min-height: var(--control-height);\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    box-shadow var(--transition-fast);\n}\n\ninput:hover:not(:disabled),\ntextarea:hover:not(:disabled),\nselect:hover:not(:disabled) {\n  border-color: var(--surface-border-hover);\n}\n\ninput:focus, textarea:focus, select:focus {\n  outline: none;\n  border-color: var(--color-border-focus);\n  box-shadow: var(--shadow-focus);\n}\n\nselect {\n  appearance: none;\n  padding-right: 2.65rem;\n  background-image:\n    linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),\n    linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);\n  background-position: calc(100% - 1.15rem) 50%, calc(100% - 0.78rem) 50%;\n  background-size: 0.38rem 0.38rem, 0.38rem 0.38rem;\n  background-repeat: no-repeat;\n}\n\ninput[type='checkbox'] {\n  appearance: none;\n  width: 1rem;\n  height: 1rem;\n  min-width: 1rem;\n  min-height: 1rem;\n  display: inline-grid;\n  place-content: center;\n  flex: 0 0 auto;\n  padding: 0;\n  border: 1.5px solid var(--border-strong);\n  border-radius: 0.28rem;\n  background: var(--bg-surface);\n  color: var(--text-inverse);\n  vertical-align: middle;\n  cursor: pointer;\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    box-shadow var(--transition-fast),\n    transform var(--duration-instant) var(--ease-premium);\n}\n\ninput[type='checkbox']::before {\n  content: \"\";\n  width: 0.34rem;\n  height: 0.58rem;\n  margin-top: -0.08rem;\n  border-right: 2px solid currentColor;\n  border-bottom: 2px solid currentColor;\n  opacity: 0;\n  transform: rotate(40deg) scale(0.72);\n  transform-origin: 55% 60%;\n  transition:\n    opacity var(--duration-instant) var(--ease-premium),\n    transform var(--transition-fast);\n}\n\ninput[type='checkbox']:checked {\n  border-color: var(--accent-primary);\n  background: var(--accent-primary);\n}\n\ninput[type='checkbox']:checked::before {\n  opacity: 1;\n  transform: rotate(40deg) scale(1);\n}\n\nbutton {\n  cursor: pointer;\n  touch-action: manipulation;\n  border: 1px solid var(--color-button-secondary-border);\n  border-radius: var(--radius-control);\n  background: var(--color-button-secondary-bg);\n  color: var(--color-button-secondary-text);\n  padding: var(--space-2) var(--space-4);\n  min-height: var(--control-height);\n  font-weight: var(--font-weight-medium);\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    box-shadow var(--transition-fast),\n    transform var(--duration-instant) var(--ease-premium),\n    opacity var(--transition-fast);\n}\n\nbutton:active:not(:disabled) { transform: scale(0.98); }\nbutton:disabled { opacity: 0.5; cursor: not-allowed; }\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n}\n\nth, td {\n  text-align: left;\n  padding: var(--space-2) var(--space-3);\n  border-bottom: 1px solid var(--color-border-primary);\n}\n\nth {\n  font-weight: var(--font-weight-semibold);\n  font-size: var(--font-size-sm);\n  color: var(--color-text-secondary);\n  background: var(--color-bg-secondary);\n}\n\ntr:hover td { background-color: var(--bg-hover); }\n\n::-webkit-scrollbar { width: 8px; height: 8px; }\n::-webkit-scrollbar-track { background: var(--color-bg-secondary); }\n::-webkit-scrollbar-thumb {\n  background: color-mix(in srgb, var(--text-primary) 22%, transparent);\n  border-radius: 4px;\n  border: 2px solid var(--color-bg-secondary);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 1ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 1ms !important;\n  }\n}\n<\u002Fstyle>\n  <style>/* Atlas Balance — Reusable component classes.\n   Mirrors the product's global component styling so React primitives and\n   hand-written UI-kit markup share one source of truth. */\n\n/* ============================ Buttons ============================ */\n.ab-button,\n.button,\n.button-primary,\n.button-secondary,\n.button-tertiary,\n.button-warning,\n.button-danger,\n.button-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  min-height: var(--control-height);\n  border-radius: var(--radius-control);\n  border: 1px solid transparent;\n  padding: var(--space-2) var(--space-4);\n  font-weight: var(--font-weight-semibold);\n  text-decoration: none;\n  cursor: pointer;\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    color var(--transition-fast),\n    box-shadow var(--transition-fast),\n    transform var(--duration-instant) var(--ease-premium),\n    opacity var(--transition-fast);\n}\n\n.button-primary {\n  background: var(--accent-primary);\n  color: var(--text-inverse);\n  border-color: color-mix(in srgb, var(--accent-primary-hover) 36%, var(--accent-primary));\n  box-shadow: var(--shadow-sm);\n}\n.button-primary:hover:not(:disabled) {\n  background: var(--accent-primary-hover);\n  box-shadow: var(--shadow-card-hover);\n  text-decoration: none;\n}\n@media (hover: hover) and (pointer: fine) {\n  .button-primary:hover:not(:disabled) { transform: translateY(-1px); }\n}\n.button-primary:active:not(:disabled) {\n  transform: translateY(0) scale(0.98);\n  box-shadow: var(--shadow-sm);\n}\n\n.button-secondary {\n  background: var(--bg-surface-soft);\n  border-color: var(--control-border);\n  color: var(--text-primary);\n}\n.button-secondary:hover:not(:disabled) {\n  background: var(--bg-surface-muted);\n  text-decoration: none;\n}\n\n.button-tertiary {\n  background: transparent;\n  color: var(--text-link);\n  padding-inline: var(--space-2);\n}\n.button-tertiary:hover:not(:disabled) {\n  background: var(--accent-primary-soft);\n  text-decoration: none;\n}\n\n.button-warning {\n  background: var(--warning-bg);\n  border-color: color-mix(in srgb, var(--warning-text) 32%, transparent);\n  color: var(--warning-text);\n}\n.button-warning:hover:not(:disabled) {\n  background: color-mix(in srgb, var(--warning-bg) 72%, var(--warning-text) 28%);\n  border-color: var(--warning-text);\n  text-decoration: none;\n}\n\n.button-danger {\n  background: var(--danger-bg);\n  border-color: color-mix(in srgb, var(--danger-text) 30%, transparent);\n  color: var(--danger-text);\n}\n.button-danger:hover:not(:disabled) {\n  background: var(--danger-text);\n  color: var(--text-inverse);\n  text-decoration: none;\n}\n\n.button-icon {\n  width: var(--control-height);\n  padding: 0;\n}\n\n.button-primary:disabled,\n.button-secondary:disabled,\n.button-tertiary:disabled,\n.button-warning:disabled,\n.button-danger:disabled,\n.button-icon:disabled { opacity: 0.5; cursor: not-allowed; }\n\n.ab-button--sm { min-height: var(--control-height-compact); padding: var(--space-1) var(--space-3); font-size: var(--font-size-sm); }\n.ab-button--block { width: 100%; }\n\n/* ============================ Badges / Tags ============================ */\n.ab-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.3rem;\n  min-height: 1.5rem;\n  padding: 0 var(--space-2);\n  border-radius: var(--radius-pill);\n  border: 1px solid transparent;\n  font-size: var(--font-size-xs);\n  font-weight: var(--font-weight-semibold);\n  letter-spacing: 0.02em;\n  line-height: 1;\n}\n.ab-badge--neutral { background: var(--bg-surface-muted); color: var(--text-secondary); border-color: var(--border-soft); }\n.ab-badge--accent  { background: var(--accent-primary-soft); color: var(--color-sidebar-active-text); }\n.ab-badge--success { background: var(--success-bg); color: var(--success-text); border-color: color-mix(in srgb, var(--success-text) 22%, transparent); }\n.ab-badge--warning { background: var(--warning-bg); color: var(--warning-text); border-color: color-mix(in srgb, var(--warning-text) 24%, transparent); }\n.ab-badge--danger  { background: var(--danger-bg); color: var(--danger-text); border-color: color-mix(in srgb, var(--danger-text) 24%, transparent); }\n.ab-badge--info    { background: var(--info-bg); color: var(--info-text); }\n\n.ab-badge-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; }\n\n/* ============================ Cards ============================ */\n.ab-card {\n  border: 1px solid var(--border-soft);\n  border-radius: var(--radius-card);\n  background: var(--bg-surface);\n  box-shadow: var(--shadow-card);\n  padding: var(--space-5);\n  min-width: 0;\n}\n.ab-card--raised { box-shadow: var(--shadow-card-hover); }\n.ab-card--flush { padding: 0; overflow: hidden; }\n\n.ab-card-header {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: var(--space-3);\n  padding-bottom: var(--space-3);\n  border-bottom: 1px solid var(--border-soft);\n  margin-bottom: var(--space-4);\n}\n.ab-card-header h2, .ab-card-header h3 {\n  margin: 0;\n  font-size: var(--font-size-lg);\n  font-weight: var(--font-weight-heavy);\n  line-height: 1.15;\n}\n.ab-card-meta { color: var(--text-secondary); font-size: var(--font-size-sm); }\n\n/* ============================ KPI tile ============================ */\n.ab-kpi {\n  border: 1px solid var(--border-soft);\n  border-radius: var(--radius-card);\n  background: var(--bg-surface);\n  padding: var(--space-5);\n  box-shadow: var(--shadow-card);\n  container-type: inline-size;\n  min-width: 0;\n  transition: box-shadow var(--transition-fast), transform var(--transition-fast);\n}\n@media (hover: hover) and (pointer: fine) {\n  .ab-kpi:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-2px); }\n}\n.ab-kpi h3 {\n  font-size: var(--font-size-xs);\n  color: var(--color-text-secondary);\n  margin-bottom: var(--space-1);\n  text-transform: uppercase;\n  letter-spacing: 0.09em;\n  font-weight: var(--font-weight-bold);\n}\n.ab-kpi p {\n  font-family: var(--font-family-mono);\n  font-size: clamp(1.35rem, 6cqw, 1.9rem);\n  font-weight: var(--font-weight-bold);\n  line-height: 1.15;\n  overflow-wrap: anywhere;\n}\n.ab-kpi-helper { display: block; margin-top: var(--space-2); color: var(--text-secondary); font-size: var(--font-size-xs); }\n.ab-kpi--featured {\n  border-color: color-mix(in srgb, var(--accent-primary) 36%, var(--border-soft));\n  background: color-mix(in srgb, var(--accent-primary) 7%, var(--bg-surface));\n  box-shadow: var(--shadow-card), inset 0 1px 0 color-mix(in srgb, var(--accent-primary) 14%, transparent);\n}\n.ab-kpi--featured h3 { color: color-mix(in srgb, var(--accent-primary) 72%, var(--color-text-secondary)); }\n.ab-kpi--featured p { font-size: clamp(1.6rem, 7cqw, var(--font-size-kpi)); font-weight: var(--font-weight-heavy); }\n.ab-kpi--positive p { color: var(--color-success); }\n.ab-kpi--negative p { color: var(--color-danger); }\n\n/* ============================ Field / label ============================ */\n.ab-field { display: grid; gap: var(--space-2); min-width: 0; }\n.ab-field-label { color: var(--text-primary); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); }\n.ab-field-hint { color: var(--text-muted); font-size: var(--font-size-xs); }\n.ab-field-error { color: var(--danger-text); font-size: var(--font-size-xs); }\n.ab-input { width: 100%; }\n.ab-input--invalid { border-color: var(--color-border-danger); }\n\n/* ============================ Signed amounts ============================ */\n.signed-amount { font-variant-numeric: tabular-nums; font-family: var(--font-family-mono); }\n.signed-amount--positive { color: var(--color-amount-positive); }\n.signed-amount--negative { color: var(--color-amount-negative); }\n\n/* ============================ Empty state ============================ */\n.ab-empty {\n  position: relative;\n  overflow: hidden;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-card);\n  background: var(--bg-surface-soft);\n  color: var(--color-text-secondary);\n  padding: var(--space-5);\n  display: grid;\n  justify-items: start;\n  gap: var(--space-2);\n}\n.ab-empty-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 3rem;\n  height: 3rem;\n  border-radius: var(--radius-control);\n  background: var(--bg-surface);\n  color: var(--text-link);\n  border: 1px solid var(--border-soft);\n  box-shadow: var(--shadow-sm);\n}\n.ab-empty h3 { font-size: var(--font-size-md); color: var(--text-primary); }\n\n/* ============================ Toast ============================ */\n.ab-toast {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-2);\n  padding: var(--space-2) var(--space-3);\n  border-radius: var(--radius-control);\n  border: 1px solid var(--color-border-primary);\n  background: var(--color-bg-primary);\n  box-shadow: var(--shadow-md);\n  min-width: 16rem;\n}\n.ab-toast--error { border-color: var(--color-border-danger); color: var(--color-text-danger); }\n.ab-toast--success { border-color: color-mix(in srgb, var(--success-text) 24%, transparent); color: var(--success-text); }\n.ab-toast--warning { border-color: color-mix(in srgb, var(--warning-text) 26%, transparent); color: var(--warning-text); }\n\n/* ============================ Tabs ============================ */\n.ab-tabs { display: inline-flex; gap: var(--space-1); padding: var(--space-1); border-radius: var(--radius-control); background: var(--bg-surface-muted); border: 1px solid var(--border-soft); }\n.ab-tab {\n  appearance: none;\n  border: 1px solid transparent;\n  background: transparent;\n  color: var(--text-secondary);\n  min-height: var(--control-height-compact);\n  padding: var(--space-1) var(--space-4);\n  border-radius: calc(var(--radius-control) - 3px);\n  font-weight: var(--font-weight-semibold);\n  font-size: var(--font-size-sm);\n  transition: background-color var(--transition-fast), color var(--transition-fast);\n}\n.ab-tab:hover:not(.ab-tab--active) { color: var(--text-primary); }\n.ab-tab--active { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   Atlas Balance — Design System\n   Global entry point. Consumers link this single file.\n   Order matters: fonts → tokens → base elements.\n   ============================================================ */\n\n/* Atlas Balance — Webfont declarations\n   Hind Madurai  → headings / display\n   National Park → body / UI\n   Atlas Mono (JetBrains Mono) → numerals, amounts, code */\n\n@font-face {\n  font-family: \"National Park\";\n  src: url(\"39203844-0ff3-4ab3-b570-55fd10909b32\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"National Park\";\n  src: url(\"2f52f74d-4f3b-4af3-a4ba-71d03fd88b20\") format(\"truetype\");\n  font-weight: 700 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"b38d5ef5-6d8d-4988-8f25-38cf234cf9db\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"7810aee9-2f43-4153-84e8-0fd9538e22f5\") format(\"truetype\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"d526e595-e6b0-485d-9b40-89d8fc46d736\") format(\"truetype\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Hind Madurai\";\n  src: url(\"da1d2265-26e0-4238-b2c6-49f626d370b1\") format(\"truetype\");\n  font-weight: 700 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Atlas Mono\";\n  src: url(\"f4b07c48-191c-4828-8532-8a839fd59d0f\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Atlas Mono\";\n  src: url(\"5d49d9b5-bc24-4735-8712-9f5f5747eea8\") format(\"truetype\");\n  font-weight: 700 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* Atlas Balance — Color tokens\n   Light theme on :root, dark theme on [data-theme=\"dark\"].\n   Base values first, semantic aliases (--color-*) layered on top. */\n\n:root {\n  /* ---- Surfaces ---- */\n  --bg-app: #f3f7fb;\n  --bg-canvas: #f7fafc;\n  --bg-surface: #fbfcfe;\n  --bg-surface-soft: #f1f5fa;\n  --bg-surface-muted: #e9eff6;\n  --bg-input: #fbfcfe;\n  --bg-hover: #e9eff6;\n  --bg-selected: #e6eefc;\n\n  /* ---- Borders ---- */\n  --border-soft: rgba(23, 33, 52, 0.10);\n  --border-strong: rgba(23, 33, 52, 0.18);\n  --border-medium: var(--border-strong);\n  --border-focus: #285bd9;\n\n  /* ---- Text ---- */\n  --text-primary: #172033;\n  --text-secondary: #536174;\n  --text-muted: #5f6b7a;\n  --text-inverse: #f8fbff;\n  --text-link: #244fbd;\n\n  /* ---- Accent (treasury blue) ---- */\n  --accent-primary: #285bd9;\n  --accent-primary-hover: #214cad;\n  --accent-primary-soft: #e6eefc;\n\n  /* ---- Semantic status ---- */\n  --success-bg: #eaf8f0;\n  --success-text: #176a3a;\n  --warning-bg: #fff4df;\n  --warning-text: #8a5200;\n  --danger-bg: #fdecef;\n  --danger-text: #a82234;\n  --info-bg: #eaf1ff;\n  --info-text: #315fcf;\n\n  /* ---- Financial amounts ---- */\n  --amount-positive: #176a3a;\n  --amount-negative: #a82234;\n\n  /* ---- Charts ---- */\n  --chart-ingresos: #2f9f68;\n  --chart-egresos: #c94a5a;\n  --chart-saldo: #285bd9;\n  --chart-grid: rgba(23, 33, 52, 0.10);\n  --chart-series-1: #3f7dbe;\n  --chart-series-2: #2f9f68;\n  --chart-series-3: #c5663d;\n  --chart-series-4: #8d62a8;\n  --chart-series-5: #9a751d;\n  --chart-series-6: #4f93d4;\n  --chart-series-7: #4aa584;\n  --chart-series-8: #d07652;\n  --chart-series-9: #a978b8;\n  --chart-series-10: #b98924;\n  --chart-series-other: #536174;\n\n  /* ---- Flagged / review rows ---- */\n  --row-flagged-bg: #fff2bd;\n  --row-flagged-border: rgba(172, 118, 0, 0.42);\n\n  /* ---- Sidebar ---- */\n  --color-bg-sidebar: #fbfcfe;\n  --color-sidebar-text: #445266;\n  --color-sidebar-active-bg: var(--accent-primary-soft);\n  --color-sidebar-active-text: #214cad;\n\n  /* ====================================================\n     Semantic aliases — prefer these in components\n     ==================================================== */\n  --color-bg-primary: var(--bg-surface);\n  --color-bg-secondary: var(--bg-app);\n  --color-bg-tertiary: var(--bg-surface-muted);\n  --color-bg-input: var(--bg-input);\n  --color-bg-hover: var(--bg-hover);\n  --color-bg-selected: var(--bg-selected);\n  --color-bg-danger: var(--danger-bg);\n  --color-bg-warning: var(--warning-bg);\n  --color-bg-success: var(--success-bg);\n\n  --color-button-secondary-bg: var(--bg-surface-soft);\n  --color-button-secondary-hover: var(--bg-surface-muted);\n  --color-button-secondary-border: var(--border-strong);\n  --color-button-secondary-text: var(--text-primary);\n\n  --color-text-primary: var(--text-primary);\n  --color-text-secondary: var(--text-secondary);\n  --color-text-muted: var(--text-muted);\n  --color-text-inverse: var(--text-inverse);\n  --color-text-link: var(--text-link);\n  --color-text-danger: var(--danger-text);\n  --color-text-success: var(--success-text);\n  --color-amount-positive: var(--amount-positive);\n  --color-amount-negative: var(--amount-negative);\n\n  --color-border-primary: var(--border-soft);\n  --color-border-focus: var(--border-focus);\n  --color-border-danger: rgba(168, 34, 52, 0.34);\n\n  --color-accent: var(--accent-primary);\n  --color-accent-hover: var(--accent-primary-hover);\n  --color-danger: var(--danger-text);\n  --color-danger-hover: #8f1d2c;\n  --color-success: var(--success-text);\n  --color-warning: var(--warning-text);\n\n  --color-row-flagged: var(--row-flagged-bg);\n  --color-row-flagged-border: var(--row-flagged-border);\n\n  /* ---- Surface composition helpers ---- */\n  --surface-border: var(--border-soft);\n  --surface-border-hover: color-mix(in srgb, var(--accent-primary) 24%, var(--border-soft));\n  --surface-bg-raised: color-mix(in srgb, var(--bg-surface) 94%, transparent);\n  --surface-bg-sunken: color-mix(in srgb, var(--bg-surface-soft) 84%, var(--bg-app));\n  --surface-highlight: color-mix(in srgb, var(--accent-primary) 8%, var(--bg-surface));\n}\n\n[data-theme=\"dark\"] {\n  --bg-app: #12171f;\n  --bg-canvas: #151b24;\n  --bg-surface: #1b2330;\n  --bg-surface-soft: #202a38;\n  --bg-surface-muted: #293545;\n  --bg-input: #161d27;\n  --bg-hover: #242f3e;\n  --bg-selected: #233558;\n\n  --border-soft: rgba(216, 226, 240, 0.10);\n  --border-strong: rgba(216, 226, 240, 0.18);\n  --border-medium: var(--border-strong);\n  --border-focus: #82a4ff;\n\n  --text-primary: #f1f5f9;\n  --text-secondary: #b7c2d2;\n  --text-muted: #98a6ba;\n  --text-inverse: #101720;\n  --text-link: #a8bdff;\n\n  --accent-primary: #82a4ff;\n  --accent-primary-hover: #a8bdff;\n  --accent-primary-soft: rgba(130, 164, 255, 0.14);\n\n  --success-bg: rgba(81, 185, 124, 0.14);\n  --success-text: #8de0ae;\n  --warning-bg: rgba(209, 144, 44, 0.16);\n  --warning-text: #f3c270;\n  --danger-bg: rgba(216, 74, 91, 0.16);\n  --danger-text: #ff9aa7;\n  --info-bg: rgba(130, 164, 255, 0.14);\n  --info-text: #b9c9ff;\n\n  --amount-positive: #8de0ae;\n  --amount-negative: #ff9aa7;\n\n  --chart-ingresos: #78d99c;\n  --chart-egresos: #ff8795;\n  --chart-saldo: #9fb6ff;\n  --chart-grid: rgba(216, 226, 240, 0.10);\n  --chart-series-1: #82b8f4;\n  --chart-series-2: #78d99c;\n  --chart-series-3: #ff9f78;\n  --chart-series-4: #d7a3e5;\n  --chart-series-5: #f0c96e;\n  --chart-series-6: #65a7df;\n  --chart-series-7: #5fc28f;\n  --chart-series-8: #ea8c69;\n  --chart-series-9: #c58cda;\n  --chart-series-10: #ddb857;\n  --chart-series-other: #b7c2d2;\n\n  --row-flagged-bg: rgba(255, 196, 70, 0.18);\n  --row-flagged-border: rgba(255, 213, 112, 0.42);\n\n  --color-bg-sidebar: #1b2330;\n  --color-sidebar-text: #c0cbda;\n  --color-sidebar-active-bg: rgba(130, 164, 255, 0.16);\n  --color-sidebar-active-text: #d5ddff;\n\n  --surface-bg-raised: color-mix(in srgb, var(--bg-surface) 90%, transparent);\n  --surface-bg-sunken: color-mix(in srgb, var(--bg-surface-soft) 76%, var(--bg-app));\n  --surface-highlight: color-mix(in srgb, var(--accent-primary) 12%, var(--bg-surface));\n}\n\n/* Atlas Balance — Typography tokens\n   Headings: Hind Madurai · Body/UI: National Park · Numerals: Atlas Mono */\n\n:root {\n  --font-family-heading: \"Hind Madurai\", \"Aptos Display\", \"Segoe UI\", sans-serif;\n  --font-family: \"National Park\", \"Aptos\", \"Segoe UI\", sans-serif;\n  --font-family-mono: \"Atlas Mono\", \"JetBrains Mono\", \"SF Mono\", monospace;\n\n  /* Type scale (rem, base 16px) */\n  --font-size-xs: 0.75rem;    /* 12px — labels, meta, badges */\n  --font-size-sm: 0.8125rem;  /* 13px — secondary text, table cells */\n  --font-size-base: 0.875rem; /* 14px — body default */\n  --font-size-md: 1rem;       /* 16px — emphasis, topbar title */\n  --font-size-lg: 1.125rem;   /* 18px — card headings */\n  --font-size-xl: 1.5rem;     /* 24px — section titles (h2) */\n  --font-size-2xl: 2rem;      /* 32px — page titles (h1) */\n  --font-size-kpi: clamp(2rem, 3vw, 2.75rem); /* hero metrics */\n\n  /* Weights */\n  --font-weight-normal: 400;\n  --font-weight-medium: 500;\n  --font-weight-semibold: 600;\n  --font-weight-bold: 700;\n  --font-weight-heavy: 800;\n\n  /* Line heights */\n  --line-height-tight: 1.18;  /* headings */\n  --line-height-normal: 1.55; /* body */\n}\n\n/* Atlas Balance — Spacing, sizing & layout tokens\n   8px-based rhythm with named aliases. */\n\n:root {\n  /* Raw spacing steps */\n  --space-1: 0.25rem;  /* 4 */\n  --space-2: 0.5rem;   /* 8 */\n  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.5rem;   /* 24 */\n  --space-6: 2rem;     /* 32 */\n  --space-8: 3rem;     /* 48 */\n  --space-10: 4rem;    /* 64 */\n\n  /* Named aliases */\n  --space-xxs: var(--space-1);\n  --space-xs: var(--space-2);\n  --space-sm: var(--space-3);\n  --space-md: var(--space-4);\n  --space-lg: var(--space-5);\n  --space-xl: var(--space-6);\n  --space-2xl: var(--space-8);\n  --space-3xl: var(--space-10);\n\n  /* App shell dimensions */\n  --sidebar-width: 252px;\n  --sidebar-collapsed-width: 72px;\n  --topbar-height: 68px;\n\n  /* Control sizing */\n  --control-height: 2.75rem;          /* 44px — min hit target */\n  --control-height-compact: 2.45rem;\n  --control-padding-x: var(--space-3);\n}\n\n/* Atlas Balance — Radii, shadows, motion & z-index tokens.\n   Premium feel: soft layered shadows, a single signature easing curve,\n   restrained radii (8px controls/cards, larger panels & shell). */\n\n:root {\n  /* ---- Corner radii ---- */\n  --border-radius-sm: 8px;\n  --border-radius-md: 8px;\n  --border-radius-lg: 12px;\n  --border-radius-full: 999px;\n  --radius-control: 8px;   /* buttons, inputs, selects */\n  --radius-card: 8px;      /* cards, KPI tiles */\n  --radius-panel: 18px;    /* modals, auth card, sheets */\n  --radius-shell: 22px;    /* outermost shells */\n  --radius-pill: 999px;    /* badges, chips */\n\n  /* ---- Control surfaces ---- */\n  --control-border: var(--border-strong);\n  --control-bg: var(--bg-input);\n  --control-bg-hover: var(--bg-hover);\n  --control-ring: 0 0 0 3px color-mix(in srgb, var(--border-focus) 18%, transparent);\n\n  /* ---- Shadow system (warm, low-opacity, layered) ---- */\n  --shadow-sm: 0 2px 10px color-mix(in srgb, var(--text-primary) 5%, transparent);\n  --shadow-md: 0 10px 28px color-mix(in srgb, var(--text-primary) 7%, transparent);\n  --shadow-lg: 0 16px 38px color-mix(in srgb, var(--text-primary) 9%, transparent);\n  --shadow-overlay: 0 24px 60px color-mix(in srgb, var(--text-primary) 16%, transparent);\n  --shadow-card: 0 8px 24px color-mix(in srgb, var(--text-primary) 6%, transparent);\n  --shadow-card-hover: 0 16px 34px color-mix(in srgb, var(--text-primary) 10%, transparent);\n  --shadow-shell: 0 24px 60px color-mix(in srgb, var(--text-primary) 12%, transparent);\n  --shadow-focus: var(--control-ring);\n\n  /* ---- Motion ---- */\n  --ease-premium: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --duration-instant: 120ms; /* @kind other */\n  --duration-fast: 180ms; /* @kind other */\n  --duration-base: 240ms; /* @kind other */\n  --duration-slow: 420ms; /* @kind other */\n  --transition-fast: var(--duration-fast) var(--ease-premium);\n  --transition-normal: var(--duration-base) var(--ease-premium);\n\n  /* ---- Z-index scale ---- */\n  --z-dropdown: 100; /* @kind other */\n  --z-sticky: 200; /* @kind other */\n  --z-modal-backdrop: 300; /* @kind other */\n  --z-modal: 400; /* @kind other */\n  --z-toast: 500; /* @kind other */\n  --z-tooltip: 600; /* @kind other */\n}\n\n[data-theme=\"dark\"] {\n  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.22);\n  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.28);\n  --shadow-lg: 0 16px 38px rgba(0, 0, 0, 0.34);\n  --shadow-overlay: 0 24px 60px rgba(0, 0, 0, 0.48);\n  --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.26);\n  --shadow-card-hover: 0 16px 36px rgba(0, 0, 0, 0.36);\n  --shadow-shell: 0 24px 60px rgba(0, 0, 0, 0.44);\n}\n\n/* Atlas Balance — Base element styling.\n   Resets + foundational typography, controls, tables. Consumes tokens. */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml {\n  font-size: 16px;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  color-scheme: light;\n}\n\nhtml[data-theme=\"dark\"] {\n  color-scheme: dark;\n}\n\n:focus-visible {\n  outline: 2px solid var(--color-border-focus);\n  outline-offset: 2px;\n}\n\nbody {\n  font-family: var(--font-family);\n  font-size: var(--font-size-base);\n  line-height: var(--line-height-normal);\n  color: var(--color-text-primary);\n  background: var(--bg-app);\n  font-variant-numeric: tabular-nums;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-family-heading);\n  font-weight: var(--font-weight-semibold);\n  line-height: var(--line-height-tight);\n  color: var(--color-text-primary);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--font-size-2xl); }\nh2 { font-size: var(--font-size-xl); }\nh3 { font-size: var(--font-size-lg); }\nh4 { font-size: var(--font-size-md); }\nh5 { font-size: var(--font-size-base); }\nh6 { font-size: var(--font-size-sm); }\n\na {\n  color: var(--color-text-link);\n  text-decoration: none;\n  text-underline-offset: 0.18em;\n}\na:hover { text-decoration: underline; }\n\ninput, textarea, select, button {\n  font-family: inherit;\n  font-size: inherit;\n}\n\ninput, textarea, select {\n  background: var(--control-bg);\n  border: 1px solid var(--control-border);\n  border-radius: var(--radius-control);\n  padding: var(--space-2) var(--control-padding-x);\n  color: var(--color-text-primary);\n  min-height: var(--control-height);\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    box-shadow var(--transition-fast);\n}\n\ninput:hover:not(:disabled),\ntextarea:hover:not(:disabled),\nselect:hover:not(:disabled) {\n  border-color: var(--surface-border-hover);\n}\n\ninput:focus, textarea:focus, select:focus {\n  outline: none;\n  border-color: var(--color-border-focus);\n  box-shadow: var(--shadow-focus);\n}\n\nselect {\n  appearance: none;\n  padding-right: 2.65rem;\n  background-image:\n    linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),\n    linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);\n  background-position: calc(100% - 1.15rem) 50%, calc(100% - 0.78rem) 50%;\n  background-size: 0.38rem 0.38rem, 0.38rem 0.38rem;\n  background-repeat: no-repeat;\n}\n\ninput[type='checkbox'] {\n  appearance: none;\n  width: 1rem;\n  height: 1rem;\n  min-width: 1rem;\n  min-height: 1rem;\n  display: inline-grid;\n  place-content: center;\n  flex: 0 0 auto;\n  padding: 0;\n  border: 1.5px solid var(--border-strong);\n  border-radius: 0.28rem;\n  background: var(--bg-surface);\n  color: var(--text-inverse);\n  vertical-align: middle;\n  cursor: pointer;\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    box-shadow var(--transition-fast),\n    transform var(--duration-instant) var(--ease-premium);\n}\n\ninput[type='checkbox']::before {\n  content: \"\";\n  width: 0.34rem;\n  height: 0.58rem;\n  margin-top: -0.08rem;\n  border-right: 2px solid currentColor;\n  border-bottom: 2px solid currentColor;\n  opacity: 0;\n  transform: rotate(40deg) scale(0.72);\n  transform-origin: 55% 60%;\n  transition:\n    opacity var(--duration-instant) var(--ease-premium),\n    transform var(--transition-fast);\n}\n\ninput[type='checkbox']:checked {\n  border-color: var(--accent-primary);\n  background: var(--accent-primary);\n}\n\ninput[type='checkbox']:checked::before {\n  opacity: 1;\n  transform: rotate(40deg) scale(1);\n}\n\nbutton {\n  cursor: pointer;\n  touch-action: manipulation;\n  border: 1px solid var(--color-button-secondary-border);\n  border-radius: var(--radius-control);\n  background: var(--color-button-secondary-bg);\n  color: var(--color-button-secondary-text);\n  padding: var(--space-2) var(--space-4);\n  min-height: var(--control-height);\n  font-weight: var(--font-weight-medium);\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    box-shadow var(--transition-fast),\n    transform var(--duration-instant) var(--ease-premium),\n    opacity var(--transition-fast);\n}\n\nbutton:active:not(:disabled) { transform: scale(0.98); }\nbutton:disabled { opacity: 0.5; cursor: not-allowed; }\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n}\n\nth, td {\n  text-align: left;\n  padding: var(--space-2) var(--space-3);\n  border-bottom: 1px solid var(--color-border-primary);\n}\n\nth {\n  font-weight: var(--font-weight-semibold);\n  font-size: var(--font-size-sm);\n  color: var(--color-text-secondary);\n  background: var(--color-bg-secondary);\n}\n\ntr:hover td { background-color: var(--bg-hover); }\n\n::-webkit-scrollbar { width: 8px; height: 8px; }\n::-webkit-scrollbar-track { background: var(--color-bg-secondary); }\n::-webkit-scrollbar-thumb {\n  background: color-mix(in srgb, var(--text-primary) 22%, transparent);\n  border-radius: 4px;\n  border: 2px solid var(--color-bg-secondary);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 1ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 1ms !important;\n  }\n}\n\n/* Atlas Balance — Reusable component classes.\n   Mirrors the product's global component styling so React primitives and\n   hand-written UI-kit markup share one source of truth. */\n\n/* ============================ Buttons ============================ */\n.ab-button,\n.button,\n.button-primary,\n.button-secondary,\n.button-tertiary,\n.button-warning,\n.button-danger,\n.button-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  min-height: var(--control-height);\n  border-radius: var(--radius-control);\n  border: 1px solid transparent;\n  padding: var(--space-2) var(--space-4);\n  font-weight: var(--font-weight-semibold);\n  text-decoration: none;\n  cursor: pointer;\n  transition:\n    background-color var(--transition-fast),\n    border-color var(--transition-fast),\n    color var(--transition-fast),\n    box-shadow var(--transition-fast),\n    transform var(--duration-instant) var(--ease-premium),\n    opacity var(--transition-fast);\n}\n\n.button-primary {\n  background: var(--accent-primary);\n  color: var(--text-inverse);\n  border-color: color-mix(in srgb, var(--accent-primary-hover) 36%, var(--accent-primary));\n  box-shadow: var(--shadow-sm);\n}\n.button-primary:hover:not(:disabled) {\n  background: var(--accent-primary-hover);\n  box-shadow: var(--shadow-card-hover);\n  text-decoration: none;\n}\n@media (hover: hover) and (pointer: fine) {\n  .button-primary:hover:not(:disabled) { transform: translateY(-1px); }\n}\n.button-primary:active:not(:disabled) {\n  transform: translateY(0) scale(0.98);\n  box-shadow: var(--shadow-sm);\n}\n\n.button-secondary {\n  background: var(--bg-surface-soft);\n  border-color: var(--control-border);\n  color: var(--text-primary);\n}\n.button-secondary:hover:not(:disabled) {\n  background: var(--bg-surface-muted);\n  text-decoration: none;\n}\n\n.button-tertiary {\n  background: transparent;\n  color: var(--text-link);\n  padding-inline: var(--space-2);\n}\n.button-tertiary:hover:not(:disabled) {\n  background: var(--accent-primary-soft);\n  text-decoration: none;\n}\n\n.button-warning {\n  background: var(--warning-bg);\n  border-color: color-mix(in srgb, var(--warning-text) 32%, transparent);\n  color: var(--warning-text);\n}\n.button-warning:hover:not(:disabled) {\n  background: color-mix(in srgb, var(--warning-bg) 72%, var(--warning-text) 28%);\n  border-color: var(--warning-text);\n  text-decoration: none;\n}\n\n.button-danger {\n  background: var(--danger-bg);\n  border-color: color-mix(in srgb, var(--danger-text) 30%, transparent);\n  color: var(--danger-text);\n}\n.button-danger:hover:not(:disabled) {\n  background: var(--danger-text);\n  color: var(--text-inverse);\n  text-decoration: none;\n}\n\n.button-icon {\n  width: var(--control-height);\n  padding: 0;\n}\n\n.button-primary:disabled,\n.button-secondary:disabled,\n.button-tertiary:disabled,\n.button-warning:disabled,\n.button-danger:disabled,\n.button-icon:disabled { opacity: 0.5; cursor: not-allowed; }\n\n.ab-button--sm { min-height: var(--control-height-compact); padding: var(--space-1) var(--space-3); font-size: var(--font-size-sm); }\n.ab-button--block { width: 100%; }\n\n/* ============================ Badges / Tags ============================ */\n.ab-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 0.3rem;\n  min-height: 1.5rem;\n  padding: 0 var(--space-2);\n  border-radius: var(--radius-pill);\n  border: 1px solid transparent;\n  font-size: var(--font-size-xs);\n  font-weight: var(--font-weight-semibold);\n  letter-spacing: 0.02em;\n  line-height: 1;\n}\n.ab-badge--neutral { background: var(--bg-surface-muted); color: var(--text-secondary); border-color: var(--border-soft); }\n.ab-badge--accent  { background: var(--accent-primary-soft); color: var(--color-sidebar-active-text); }\n.ab-badge--success { background: var(--success-bg); color: var(--success-text); border-color: color-mix(in srgb, var(--success-text) 22%, transparent); }\n.ab-badge--warning { background: var(--warning-bg); color: var(--warning-text); border-color: color-mix(in srgb, var(--warning-text) 24%, transparent); }\n.ab-badge--danger  { background: var(--danger-bg); color: var(--danger-text); border-color: color-mix(in srgb, var(--danger-text) 24%, transparent); }\n.ab-badge--info    { background: var(--info-bg); color: var(--info-text); }\n\n.ab-badge-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; }\n\n/* ============================ Cards ============================ */\n.ab-card {\n  border: 1px solid var(--border-soft);\n  border-radius: var(--radius-card);\n  background: var(--bg-surface);\n  box-shadow: var(--shadow-card);\n  padding: var(--space-5);\n  min-width: 0;\n}\n.ab-card--raised { box-shadow: var(--shadow-card-hover); }\n.ab-card--flush { padding: 0; overflow: hidden; }\n\n.ab-card-header {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: var(--space-3);\n  padding-bottom: var(--space-3);\n  border-bottom: 1px solid var(--border-soft);\n  margin-bottom: var(--space-4);\n}\n.ab-card-header h2, .ab-card-header h3 {\n  margin: 0;\n  font-size: var(--font-size-lg);\n  font-weight: var(--font-weight-heavy);\n  line-height: 1.15;\n}\n.ab-card-meta { color: var(--text-secondary); font-size: var(--font-size-sm); }\n\n/* ============================ KPI tile ============================ */\n.ab-kpi {\n  border: 1px solid var(--border-soft);\n  border-radius: var(--radius-card);\n  background: var(--bg-surface);\n  padding: var(--space-5);\n  box-shadow: var(--shadow-card);\n  container-type: inline-size;\n  min-width: 0;\n  transition: box-shadow var(--transition-fast), transform var(--transition-fast);\n}\n@media (hover: hover) and (pointer: fine) {\n  .ab-kpi:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-2px); }\n}\n.ab-kpi h3 {\n  font-size: var(--font-size-xs);\n  color: var(--color-text-secondary);\n  margin-bottom: var(--space-1);\n  text-transform: uppercase;\n  letter-spacing: 0.09em;\n  font-weight: var(--font-weight-bold);\n}\n.ab-kpi p {\n  font-family: var(--font-family-mono);\n  font-size: clamp(1.35rem, 6cqw, 1.9rem);\n  font-weight: var(--font-weight-bold);\n  line-height: 1.15;\n  overflow-wrap: anywhere;\n}\n.ab-kpi-helper { display: block; margin-top: var(--space-2); color: var(--text-secondary); font-size: var(--font-size-xs); }\n.ab-kpi--featured {\n  border-color: color-mix(in srgb, var(--accent-primary) 36%, var(--border-soft));\n  background: color-mix(in srgb, var(--accent-primary) 7%, var(--bg-surface));\n  box-shadow: var(--shadow-card), inset 0 1px 0 color-mix(in srgb, var(--accent-primary) 14%, transparent);\n}\n.ab-kpi--featured h3 { color: color-mix(in srgb, var(--accent-primary) 72%, var(--color-text-secondary)); }\n.ab-kpi--featured p { font-size: clamp(1.6rem, 7cqw, var(--font-size-kpi)); font-weight: var(--font-weight-heavy); }\n.ab-kpi--positive p { color: var(--color-success); }\n.ab-kpi--negative p { color: var(--color-danger); }\n\n/* ============================ Field / label ============================ */\n.ab-field { display: grid; gap: var(--space-2); min-width: 0; }\n.ab-field-label { color: var(--text-primary); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); }\n.ab-field-hint { color: var(--text-muted); font-size: var(--font-size-xs); }\n.ab-field-error { color: var(--danger-text); font-size: var(--font-size-xs); }\n.ab-input { width: 100%; }\n.ab-input--invalid { border-color: var(--color-border-danger); }\n\n/* ============================ Signed amounts ============================ */\n.signed-amount { font-variant-numeric: tabular-nums; font-family: var(--font-family-mono); }\n.signed-amount--positive { color: var(--color-amount-positive); }\n.signed-amount--negative { color: var(--color-amount-negative); }\n\n/* ============================ Empty state ============================ */\n.ab-empty {\n  position: relative;\n  overflow: hidden;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-card);\n  background: var(--bg-surface-soft);\n  color: var(--color-text-secondary);\n  padding: var(--space-5);\n  display: grid;\n  justify-items: start;\n  gap: var(--space-2);\n}\n.ab-empty-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 3rem;\n  height: 3rem;\n  border-radius: var(--radius-control);\n  background: var(--bg-surface);\n  color: var(--text-link);\n  border: 1px solid var(--border-soft);\n  box-shadow: var(--shadow-sm);\n}\n.ab-empty h3 { font-size: var(--font-size-md); color: var(--text-primary); }\n\n/* ============================ Toast ============================ */\n.ab-toast {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-2);\n  padding: var(--space-2) var(--space-3);\n  border-radius: var(--radius-control);\n  border: 1px solid var(--color-border-primary);\n  background: var(--color-bg-primary);\n  box-shadow: var(--shadow-md);\n  min-width: 16rem;\n}\n.ab-toast--error { border-color: var(--color-border-danger); color: var(--color-text-danger); }\n.ab-toast--success { border-color: color-mix(in srgb, var(--success-text) 24%, transparent); color: var(--success-text); }\n.ab-toast--warning { border-color: color-mix(in srgb, var(--warning-text) 26%, transparent); color: var(--warning-text); }\n\n/* ============================ Tabs ============================ */\n.ab-tabs { display: inline-flex; gap: var(--space-1); padding: var(--space-1); border-radius: var(--radius-control); background: var(--bg-surface-muted); border: 1px solid var(--border-soft); }\n.ab-tab {\n  appearance: none;\n  border: 1px solid transparent;\n  background: transparent;\n  color: var(--text-secondary);\n  min-height: var(--control-height-compact);\n  padding: var(--space-1) var(--space-4);\n  border-radius: calc(var(--radius-control) - 3px);\n  font-weight: var(--font-weight-semibold);\n  font-size: var(--font-size-sm);\n  transition: background-color var(--transition-fast), color var(--transition-fast);\n}\n.ab-tab:hover:not(.ab-tab--active) { color: var(--text-primary); }\n.ab-tab--active { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }\n\n<\u002Fstyle>\n  <script src=\"6c53f76a-a7c6-411f-b51c-8069a408e3db\"><\u002Fscript>\n  < nder', importe: 58200, saldo: 1327360.12, estado: 'conciliado' },\n      { fecha: '2026-06-08', concepto: 'Transferencia proveedor Indra', banco: 'CaixaBank', importe: -18450.5, saldo: 1269160.12, estado: 'pendiente', flag: true },\n      { fecha: '2026-06-06', concepto: 'Intereses plazo fijo', banco: 'BBVA', importe: 312.18, saldo: 1287610.62, estado: 'conciliado' },\n      { fecha: '2026-06-05', concepto: 'Pago seguros trimestral', banco: 'Santander', importe: -9240, saldo: 1287298.44, estado: 'revisar', flag: true },\n      { fecha: '2026-06-03', concepto: 'Devolución Hacienda', banco: 'CaixaBank', importe: 14820, saldo: 1296538.44, estado: 'conciliado' },\n      { fecha: '2026-06-02', concepto: 'Comisión mantenimiento', banco: 'BBVA', importe: -12, saldo: 1281718.44, estado: 'conciliado' },\n      { fecha: '2026-06-01', concepto: 'Cobro suscripciones SaaS', banco: 'Santander', importe: 8650.75, saldo: 1281730.44, estado: 'conciliado' },\n      { fecha: '2026-05-29', concepto: 'Alquiler oficina Madrid', banco: 'CaixaBank', importe: -6400, saldo: 1273079.69, estado: 'conciliado' },\n      { fecha: '2026-05-28', concepto: 'Cobro factura 2026-041 — Vector', banco: 'BBVA', importe: 21300, saldo: 1279479.69, estado: 'conciliado' },\n      { fecha: '2026-05-27', concepto: 'Traspaso interno a plazo fijo', banco: 'BBVA', importe: -20000, saldo: 1258179.69, estado: 'conciliado' },\n      { fecha: '2026-05-26', concepto: 'Suscripción software contable', banco: 'Santander', importe: -89.9, saldo: 1278179.69, estado: 'pendiente' },\n    ];\n    const TONE = { conciliado: 'success', pendiente: 'warning', revisar: 'danger' };\n    const LABEL = { conciliado: 'Conciliado', pendiente: 'Pendiente', revisar: 'Revisar' };\n    const fmtN = (v) => (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n\n    const q = query.trim().toLowerCase();\n    const filtered = SEED.filter((r) =>\n      (banco === 'Todos' || r.banco === banco) &&\n      (q === '' || r.concepto.toLowerCase().includes(q) || r.banco.toLowerCase().includes(q))\n    );\n    const rows = filtered.map((r) => ({\n      fecha: r.fecha,\n      concepto: r.concepto,\n      banco: r.banco,\n      imp: fmtN(r.importe),\n      impColor: r.importe < 0 ? 'var(--color-amount-negative)' : 'var(--color-amount-positive)',\n      saldoFmt: fmtN(r.saldo),\n      estadoLabel: LABEL[r.estado],\n      badgeClass: 'ab-badge ab-badge--' + TONE[r.estado],\n      bg: r.flag ? 'var(--row-flagged-bg)' : 'transparent',\n    }));\n    const neto = filtered.reduce((s, r) => s + r.importe, 0);\n    const netoFmt = (neto < 0 ? '−' : '+') + '€' + Math.abs(neto).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n\n    const bancoChips = ['Todos', 'BBVA', 'Santander', 'CaixaBank'].map((b) => {\n      const active = b === banco;\n      return {\n        label: b,\n        bg: active ? 'var(--accent-primary-soft)' : 'var(--bg-surface)',\n        color: active ? 'var(--color-sidebar-active-text)' : 'var(--text-secondary)',\n        border: active ? 'color-mix(in srgb, var(--accent-primary) 45%, transparent)' : 'var(--border-soft)',\n        go: () => set({ banco: b }),\n      };\n    });\n\n    return {\n      theme,\n      themeVars,\n      contentBg: theme === 'dark' ? '#000000' : '#ffffff',\n      railTheme,\n      navW, navJustify, navTextOpacity, navTextMaxW, navTextShift, navTextDelay, navHeaderMax, navHeaderMb, navFooterMax, navFooterPad,\n      iconMenu: this.icon('menu', 19),\n      toggleNav: () => this.setState((s) => ({ navCollapsed: !s.navCollapsed })),\n      themeIconEl: this.icon(theme === 'light' ? 'moon' : 'sun', 19),\n      iconSalir: this.icon('salir', 19),\n      iconSearch: this.icon('search', 17),\n      iconPlus: this.icon('plus', 18),\n      iconExport: this.icon('exportaciones', 18),\n      iconExtractos: this.icon('extractos', 22),\n      screenIconEl: this.icon(screen === 'login' ? 'dashboard' : screen, 22),\n      toggleTheme: () => {\n        const next = theme === 'light' ? 'dark' : 'light';\n        document.documentElement.setAttribute('data-theme', next);\n        set({ theme: next });\n      },\n\n      showLogin: screen === 'login',\n      showApp: screen !== 'login',\n      showDashboard: screen === 'dashboard',\n      showExtractos: screen === 'extractos',\n      showPlaceholder: screen !== 'login' && screen !== 'dashboard' && screen !== 'extractos',\n      screenIcon: screen,\n\n      pageTitle: meta[0],\n      pageCrumb: meta[1],\n      navGroups,\n      doLogin: () => set({ screen: 'dashboard' }),\n      doLogout: () => set({ screen: 'login' }),\n      goDashboard: () => set({ screen: 'dashboard' }),\n      noop: (e) => e.preventDefault(),\n\n      periodTabs,\n      periodoLabel: PERIODO_LABEL[periodo],\n\n      rows,\n      shownCount: rows.length,\n      tableDisplay: rows.length ? 'block' : 'none',\n      emptyDisplay: rows.length ? 'none' : 'grid',\n      netoFmt,\n      netoColor: neto < 0 ? 'var(--color-amount-negative)' : 'var(--color-amount-positive)',\n      query,\n      setQuery: (e) => set({ query: e.target.value }),\n      bancoChips,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Atlas Balance Redesign.dc"}
