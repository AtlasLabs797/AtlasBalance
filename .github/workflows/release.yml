name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example V-02.09"
        required: true
        default: "V-02-09"
      runtime:
        description: "Runtime identifier"
        required: true
        default: "win-x64"

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "Atlas Balance/frontend/package-lock.json"

      - name: Validate release inputs
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^V-\d{2}[-.]\d{2}$') {
            throw "Invalid version '${{ inputs.version }}'."
          }
          if ("${{ inputs.runtime }}" -ne "win-x64") {
            throw "Invalid runtime '${{ inputs.runtime }}'. Only win-x64 is allowed."
          }

      - name: Verify version alignment across sources
        shell: pwsh
        run: '& "./Atlas Balance/scripts/Check-VersionAlignment.ps1" -ExpectedVersion "${{ inputs.version }}"'

      - name: Restore backend
        run: |
          dotnet restore "./Atlas Balance/backend/src/AtlasBalance.API/AtlasBalance.API.csproj" --locked-mode -r win-x64
          dotnet restore "./Atlas Balance/backend/src/AtlasBalance.Watchdog/AtlasBalance.Watchdog.csproj" --locked-mode -r win-x64
          dotnet restore "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" --locked-mode
          dotnet restore "./Atlas Balance/backend/tests/AtlasBalance.Caching.Tests/AtlasBalance.Caching.Tests.csproj" --locked-mode

      - name: Pull PostgreSQL test image
        run: docker pull postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50

      - name: Test backend (sin Postgres)
        run: |
          dotnet test "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" -c Release --no-restore -- -trait- "Category=Postgres"

      - name: Test backend (Postgres con Testcontainers)
        # V-02.08: gate obligatorio de la release. El bug 42501 que mordio al
        # cliente V-02.07 (INSERT ... RETURNING tras login y MFA) sin Testcontainers
        # en CI no se detectaria. Microsoft Testing Platform + xunit v3 aceptan
        # -trait/-trait- (no --filter-trait, que es sintaxis VSTest) por
        # Trait("Category", "Postgres") en la clase.
        run: |
          dotnet test "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" -c Release --no-restore -- -trait "Category=Postgres"

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $projects = @(
            "./Atlas Balance/backend/src/AtlasBalance.API/AtlasBalance.API.csproj",
            "./Atlas Balance/backend/src/AtlasBalance.Watchdog/AtlasBalance.Watchdog.csproj",
            "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj",
            "./Atlas Balance/backend/tests/AtlasBalance.Caching.Tests/AtlasBalance.Caching.Tests.csproj"
          )
          $output = foreach ($project in $projects) {
            dotnet list $project package --vulnerable --include-transitive
          }
          $output
          if ($output -match 'has the following vulnerable packages|tiene los paquetes vulnerables') {
            throw 'NuGet vulnerability audit failed.'
          }

      - name: Scan high-confidence secrets
        shell: pwsh
        run: |
          & "./Atlas Balance/scripts/Test-AtlasSecrets.Tests.ps1" -RepoRoot "."
          & "./Atlas Balance/scripts/Test-AtlasSecrets.ps1" -Root "."

      - name: Install frontend dependencies
        working-directory: "Atlas Balance/frontend"
        run: npm ci

      - name: Audit npm vulnerabilities
        working-directory: "Atlas Balance/frontend"
        shell: pwsh
        # V-02.07 (2026-08-03): antes era `npm audit --audit-level=critical`,
        # bajado para poder convivir con el advisory de React Router. El precio
        # era que cualquier HIGH nuevo pasaba en silencio. Ahora el gate falla
        # ante cualquier advisory high/critical que no este en $allowed.
        #
        # $allowed esta VACIO a proposito: la migracion a React 19.2.8 +
        # react-router 8.3.0 cerro GHSA-qwww-vcr4-c8h2, que era la unica
        # excepcion. No anadir entradas sin justificar por que el advisory no
        # aplica a esta app, y con fecha de revision.
        run: |
          $allowed = @()
          $report = npm audit --json | ConvertFrom-Json
          $blocking = @()
          foreach ($entry in $report.vulnerabilities.PSObject.Properties) {
            foreach ($via in $entry.Value.via) {
              if ($via -isnot [string] -and $via.severity -in @('high', 'critical')) {
                $id = ($via.url -split '/')[-1]
                if ($id -notin $allowed) {
                  $blocking += "$($entry.Name): $id ($($via.severity)) - $($via.title)"
                }
              }
            }
          }
          if ($blocking.Count -gt 0) {
            $blocking | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
            Write-Host 'npm audit: advisories high/critical no documentados.'
            exit 1
          }
          Write-Host 'npm audit OK: sin advisories high/critical fuera de la lista de excepciones.'
          exit 0

      - name: Lint frontend
        working-directory: "Atlas Balance/frontend"
        run: npm run lint

      - name: Test frontend import request contracts
        working-directory: "Atlas Balance/frontend"
        run: npm run test:unit

      - name: Build frontend
        working-directory: "Atlas Balance/frontend"
        run: npm run build

  package:
    name: Package and publish latest
    needs: verify
    runs-on: windows-2022
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "Atlas Balance/frontend/package-lock.json"

      - name: Ensure signing key exists
        shell: pwsh
        env:
          ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM)) {
            throw "ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM secret is required for a public release."
          }

      - name: Build signed package
        shell: pwsh
        env:
          ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          & ".\Atlas Balance\scripts\Build-Release.ps1" -Version "${{ inputs.version }}" -Runtime "${{ inputs.runtime }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $runtime = "${{ inputs.runtime }}"
          $tag = "$version-$runtime"
          $zip = "./Atlas Balance/Atlas Balance Release/AtlasBalance-$version-$runtime.zip"
          $sig = "$zip.sig"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $sig)) {
            throw "Release package or signature missing."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sig --clobber
            gh release edit $tag --title "Atlas Balance $tag" --notes "Release $tag" --latest
          } else {
            gh release create $tag $zip $sig --title "Atlas Balance $tag" --notes "Release $tag" --latest --target "${{ github.sha }}"
          }
