name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example V-02-02"
        required: true
        default: "V-02-02"
      runtime:
        description: "Runtime identifier"
        required: true
        default: "win-x64"

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "Atlas Balance/frontend/package-lock.json"

      - name: Validate release inputs
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^V-\d{2}[-.]\d{2}$') {
            throw "Invalid version '${{ inputs.version }}'."
          }
          if ("${{ inputs.runtime }}" -ne "win-x64") {
            throw "Invalid runtime '${{ inputs.runtime }}'. Only win-x64 is allowed."
          }

      - name: Restore backend
        run: |
          dotnet restore "./Atlas Balance/backend/src/AtlasBalance.API/AtlasBalance.API.csproj" --locked-mode -r win-x64
          dotnet restore "./Atlas Balance/backend/src/AtlasBalance.Watchdog/AtlasBalance.Watchdog.csproj" --locked-mode -r win-x64
          dotnet restore "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" --locked-mode

      - name: Pull PostgreSQL test image
        run: docker pull postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50

      - name: Test backend
        run: dotnet test "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" -c Release --no-restore

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $projects = @(
            "./Atlas Balance/backend/src/AtlasBalance.API/AtlasBalance.API.csproj",
            "./Atlas Balance/backend/src/AtlasBalance.Watchdog/AtlasBalance.Watchdog.csproj",
            "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj"
          )
          $output = foreach ($project in $projects) {
            dotnet list $project package --vulnerable --include-transitive
          }
          $output
          if ($output -match 'has the following vulnerable packages|tiene los paquetes vulnerables') {
            throw 'NuGet vulnerability audit failed.'
          }

      - name: Scan high-confidence secrets
        shell: pwsh
        run: '& "./Atlas Balance/scripts/Test-AtlasSecrets.ps1" -Root "."'

      - name: Install frontend dependencies
        working-directory: "Atlas Balance/frontend"
        run: npm ci

      - name: Audit npm vulnerabilities
        working-directory: "Atlas Balance/frontend"
        run: npm audit --audit-level=moderate

      - name: Lint frontend
        working-directory: "Atlas Balance/frontend"
        run: npm run lint

      - name: Build frontend
        working-directory: "Atlas Balance/frontend"
        run: npm run build

  package:
    name: Package and publish latest
    needs: verify
    runs-on: windows-2022
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "Atlas Balance/frontend/package-lock.json"

      - name: Ensure signing key exists
        shell: pwsh
        env:
          ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM)) {
            throw "ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM secret is required for a public release."
          }

      - name: Build signed package
        shell: pwsh
        env:
          ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ATLAS_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          & ".\Atlas Balance\scripts\Build-Release.ps1" -Version "${{ inputs.version }}" -Runtime "${{ inputs.runtime }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $runtime = "${{ inputs.runtime }}"
          $tag = "$version-$runtime"
          $zip = "./Atlas Balance/Atlas Balance Release/AtlasBalance-$version-$runtime.zip"
          $sig = "$zip.sig"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $sig)) {
            throw "Release package or signature missing."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sig --clobber
            gh release edit $tag --title "Atlas Balance $tag" --notes "Release $tag" --latest
          } else {
            gh release create $tag $zip $sig --title "Atlas Balance $tag" --notes "Release $tag" --latest --target "${{ github.sha }}"
          }
