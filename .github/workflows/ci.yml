name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-gates:
    name: Policy gates (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test secret scanner fixtures
        shell: pwsh
        run: '& "./Atlas Balance/scripts/Test-AtlasSecrets.Tests.ps1" -RepoRoot "."'
      - name: Verify version alignment
        shell: pwsh
        run: '& "./Atlas Balance/scripts/Check-VersionAlignment.ps1"'

  verify:
    name: Build, test, and audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: "Atlas Balance/frontend/package-lock.json"

      - name: Restore backend
        run: |
          dotnet restore "./Atlas Balance/backend/src/AtlasBalance.API/AtlasBalance.API.csproj" --locked-mode -r win-x64
          dotnet restore "./Atlas Balance/backend/src/AtlasBalance.Watchdog/AtlasBalance.Watchdog.csproj" --locked-mode -r win-x64
          dotnet restore "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" --locked-mode
          dotnet restore "./Atlas Balance/backend/tests/AtlasBalance.Caching.Tests/AtlasBalance.Caching.Tests.csproj" --locked-mode

      - name: Pull PostgreSQL test image
        run: docker pull postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50

      - name: Test backend (sin Postgres)
        shell: bash
        run: |
          set +e
          dotnet test "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" -c Release --no-restore -- --filter-not-trait "Category=Postgres"
          test_exit=$?
          if (( test_exit != 0 )); then
            read_test_log() {
              if [[ "$(od -An -t x1 -N2 "$1" | tr -d '[:space:]')" == "fffe" ]]; then
                iconv -f UTF-16LE -t UTF-8 "$1"
              else
                cat "$1"
              fi
            }
            found_log=0
            while IFS= read -r test_log; do
              found_log=1
              read_test_log "$test_log" \
                | grep -Ei '^[[:space:]]*(failed|failure|error|con errores)[[:space:]]+AtlasBalance\.API\.Tests\.' \
                | grep -Eo 'AtlasBalance\.API\.Tests\.[A-Za-z0-9_]+\.[A-Za-z0-9_]+' \
                | sort -u
            done < <(find "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/bin" -type f -name 'AtlasBalance.API.Tests_*.log' -print)
            if (( found_log == 0 )); then
              echo "No se encontro el log de resultados de xUnit."
            fi
            echo "Solo se muestran identificadores de test; detalles y parametros permanecen fuera del log publico."
          fi
          exit "$test_exit"

      - name: Test backend (Postgres con Testcontainers)
        run: |
          dotnet test "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj" -c Release --no-restore -- --filter-trait "Category=Postgres"
        # V-02.08: este gate es el que CI debe proteger de regresiones de RLS
        # sobre AUDITORIAS. Sin el, el bug 42501 que mordio al cliente V-02.07
        # (INSERT ... RETURNING tras login y MFA) volveria a pasar sin que
        # CI lo detectase. Bajo "dotnet test -- <args>" (Microsoft Testing
        # Platform via TestingPlatformDotnetTestSupport) los flags son
        # --filter-trait/--filter-not-trait con formato name=value (sin
        # "!=": ese operador no existe en este parser); el runner nativo del
        # exe (fuera de "dotnet test") usa en cambio -trait/-trait-, un CLI
        # totalmente distinto. Trait("Category", "Postgres") en la clase.

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $projects = @(
            "./Atlas Balance/backend/src/AtlasBalance.API/AtlasBalance.API.csproj",
            "./Atlas Balance/backend/src/AtlasBalance.Watchdog/AtlasBalance.Watchdog.csproj",
            "./Atlas Balance/backend/tests/AtlasBalance.API.Tests/AtlasBalance.API.Tests.csproj",
            "./Atlas Balance/backend/tests/AtlasBalance.Caching.Tests/AtlasBalance.Caching.Tests.csproj"
          )
          $output = foreach ($project in $projects) {
            dotnet list $project package --vulnerable --include-transitive
          }
          $output
          if ($output -match 'has the following vulnerable packages|tiene los paquetes vulnerables') {
            throw 'NuGet vulnerability audit failed.'
          }

      - name: Scan high-confidence secrets
        shell: pwsh
        run: '& "./Atlas Balance/scripts/Test-AtlasSecrets.ps1" -Root "."'

      - name: Verify version alignment across sources
        shell: pwsh
        run: '& "./Atlas Balance/scripts/Check-VersionAlignment.ps1"'

      - name: Install frontend dependencies
        working-directory: "Atlas Balance/frontend"
        run: npm ci

      - name: Audit npm vulnerabilities
        working-directory: "Atlas Balance/frontend"
        shell: pwsh
        # V-02.07 (2026-08-03): antes era `npm audit --audit-level=critical`,
        # bajado para poder convivir con el advisory de React Router. El precio
        # era que cualquier HIGH nuevo pasaba en silencio. Ahora el gate falla
        # ante cualquier advisory high/critical que no este en $allowed.
        #
        # $allowed esta VACIO a proposito: la migracion a React 19.2.8 +
        # react-router 8.3.0 cerro GHSA-qwww-vcr4-c8h2, que era la unica
        # excepcion. No anadir entradas sin justificar por que el advisory no
        # aplica a esta app, y con fecha de revision.
        run: |
          $allowed = @()
          $report = npm audit --json | ConvertFrom-Json
          $blocking = @()
          foreach ($entry in $report.vulnerabilities.PSObject.Properties) {
            foreach ($via in $entry.Value.via) {
              if ($via -isnot [string] -and $via.severity -in @('high', 'critical')) {
                $id = ($via.url -split '/')[-1]
                if ($id -notin $allowed) {
                  $blocking += "$($entry.Name): $id ($($via.severity)) - $($via.title)"
                }
              }
            }
          }
          if ($blocking.Count -gt 0) {
            $blocking | Sort-Object -Unique | ForEach-Object { Write-Host $_ }
            Write-Host 'npm audit: advisories high/critical no documentados.'
            exit 1
          }
          Write-Host 'npm audit OK: sin advisories high/critical fuera de la lista de excepciones.'
          exit 0

      - name: Lint frontend
        working-directory: "Atlas Balance/frontend"
        run: npm run lint

      - name: Test frontend import request contracts
        working-directory: "Atlas Balance/frontend"
        run: npm run test:unit

      - name: Build frontend
        working-directory: "Atlas Balance/frontend"
        run: npm run build
